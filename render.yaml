# Render Blueprint for the Stampr loyalty platform.
# The backend serves the static frontend, so a single web service runs the whole app.

services:
  # --- Backend API (also serves the frontend by default) ---
  - type: web
    name: loyalty-platform-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # set in the Render dashboard (your Atlas URI)
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong secret automatically
